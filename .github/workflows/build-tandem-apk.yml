name: Build Tandem APK

# Builds the xDrip Tandem fork into an installable APK on GitHub's runners
# (which have the Android SDK + access to Maven Central / JitPack that a locked-down
# dev box may not). Push this branch to your GitHub fork, or run it manually from the
# Actions tab, then download the APK from the run's "Artifacts".

on:
  push:
    branches: [ tandem-pump, tandem-tslim ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      # Use a committed, stable debug keystore so every CI build is signed with the SAME key.
      # Without this the runner generates a fresh ~/.android/debug.keystore each run, so each APK
      # has a different signature and can't update a previously-installed build in place (forcing an
      # uninstall, which wipes the saved pump pairing). The keystore uses the standard Android debug
      # credentials (alias androiddebugkey, store/key password "android"), so the default debug
      # signingConfig picks it up automatically.
      - name: Use stable debug keystore
        run: |
          mkdir -p ~/.android
          cp tandem-debug.keystore ~/.android/debug.keystore

      - name: Build fastDebug APK
        run: ./gradlew :app:assembleFastDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xdrip-tandem-fastDebug-apk
          path: app/build/outputs/apk/fast/debug/app-fast-debug.apk
          if-no-files-found: error
